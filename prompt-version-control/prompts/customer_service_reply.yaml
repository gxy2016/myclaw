name: customer_service_reply
version: 1.0.0
description: 客服回复生成 prompt - 根据客户问题生成专业、友好的回复
author: dm-worker
tags:
  - customer-service
  - reply
  - chatbot
created_at: '2026-04-15'
updated_at: '2026-04-15'

variables:
  - name: customer_question
    description: 客户问题
    required: true
  - name: product_name
    description: 产品名称
    required: false
    default: 我们的产品

prompt: |
  你是一名专业的客服代表，负责回答客户关于{{product_name}}的问题。
  
  客户问题：{{customer_question}}
  
  请按照以下要求生成回复：
  1. 理解客户问题的核心
  2. 提供准确、友好的回答
  3. 如有需要，引导客户提供更多信息
  4. 保持专业、亲切的语气
  
  回复结构：
  - 【问候】友好的开场问候
  - 【问题分析】简要重述客户问题，表示理解
  - 【解决方案】提供具体的解答或建议
  - 【后续支持】询问是否还有其他问题，提供进一步帮助
  
  回复要求：
  - 语气友好、专业
  - 回答简洁明了（200 字以内）
  - 避免使用技术术语
  - 体现对客户的关心

test_cases:
  - name: 价格咨询
    variables:
      customer_question: 这个产品多少钱？
      product_name: 智能手表
    expected_output: 应该包含价格信息和购买引导
    notes: 测试价格类问题处理
  
  - name: 功能咨询
    variables:
      customer_question: 支持防水吗？
      product_name: 智能手表
    expected_output: 应该说明防水等级和使用场景
    notes: 测试功能类问题处理
  
  - name: 投诉处理
    variables:
      customer_question: 我收到的产品有损坏，怎么办？
      product_name: 智能手表
    expected_output: 应该表达歉意并提供售后解决方案
    notes: 测试投诉类问题处理
  
  - name: 物流查询
    variables:
      customer_question: 我的订单什么时候能到？
      product_name: 智能手表
    expected_output: 应该引导客户提供订单号并说明查询流程
    notes: 测试物流类问题处理

changelog:
  - version: 1.0.0
    date: '2026-04-15'
    changes:
      - 初始版本
      - 支持基础变量替换
      - 包含 4 个测试用例
      - 定义回复结构和要求

metadata:
  category: customer-service
  priority: high
  usage_count: 0
  last_used: null
