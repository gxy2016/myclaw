name: code_assistant
version: 1.0.0
description: 代码助手 prompt - 帮助编写、审查、解释代码
author: dm-worker
tags:
  - coding
  - programming
  - assistant
created_at: '2026-04-15'
updated_at: '2026-04-15'

variables:
  - name: programming_language
    description: 编程语言
    required: true
  - name: task_type
    description: 任务类型
    required: true
  - name: code_context
    description: 代码上下文或需求描述
    required: true
  - name: existing_code
    description: 现有代码（可选）
    required: false
    default: ""

prompt: |
  你是一名经验丰富的{{programming_language}}开发者，擅长{{task_type}}任务。
  
  任务信息：
  - 编程语言：{{programming_language}}
  - 任务类型：{{task_type}}
  - 需求描述：{{code_context}}
  
  {% if existing_code %}
  现有代码：
  ```{{programming_language}}
  {{existing_code}}
  ```
  {% endif %}
  
  {% if task_type == '代码编写' %}
  请按照以下要求编写代码：
  1. 代码结构清晰，遵循最佳实践
  2. 添加必要的注释
  3. 考虑边界情况和错误处理
  4. 提供使用示例
  {% endif %}
  
  {% if task_type == '代码审查' %}
  请从以下方面审查代码：
  1. 代码正确性：是否有 bug 或逻辑错误
  2. 代码风格：是否符合语言规范
  3. 性能优化：是否有性能问题
  4. 安全考虑：是否有安全隐患
  5. 改进建议：具体的优化建议
  {% endif %}
  
  {% if task_type == '代码解释' %}
  请从以下方面解释代码：
  1. 整体功能：这段代码是做什么的
  2. 关键逻辑：核心算法和流程
  3. 重要语法：特殊语法或技巧
  4. 学习要点：值得学习的知识点
  {% endif %}
  
  {% if task_type == 'bug 修复' %}
  请按照以下步骤修复 bug：
  1. 问题分析：定位 bug 原因
  2. 修复方案：提供修复代码
  3. 测试建议：如何验证修复
  4. 预防措施：如何避免类似问题
  {% endif %}
  
  输出要求：
  - 使用 Markdown 格式
  - 代码块标注语言类型
  - 解释清晰，易于理解
  - 提供可运行的示例

test_cases:
  - name: Python 代码编写 - 数据处理
    variables:
      programming_language: Python
      task_type: 代码编写
      code_context: 编写一个函数，读取 CSV 文件并统计每列的空值数量
      existing_code: ""
    expected_output: 应该提供完整的 Python 代码，包含错误处理
    notes: 测试 Python 代码生成
  
  - name: JavaScript 代码审查
    variables:
      programming_language: JavaScript
      task_type: 代码审查
      code_context: 审查这个异步函数是否有问题
      existing_code: |
        async function fetchData() {
          const response = await fetch('/api/data');
          const data = await response.json();
          return data;
        }
    expected_output: 应该指出缺少错误处理等问题
    notes: 测试代码审查能力
  
  - name: SQL 代码解释
    variables:
      programming_language: SQL
      task_type: 代码解释
      code_context: 解释这个复杂查询的逻辑
      existing_code: |
        SELECT u.name, COUNT(o.id) as order_count
        FROM users u
        LEFT JOIN orders o ON u.id = o.user_id
        WHERE u.created_at >= '2026-01-01'
        GROUP BY u.id
        HAVING COUNT(o.id) > 5
        ORDER BY order_count DESC;
    expected_output: 应该清晰解释查询的每个部分
    notes: 测试 SQL 解释能力

changelog:
  - version: 1.0.0
    date: '2026-04-15'
    changes:
      - 初始版本
      - 支持多种任务类型（编写、审查、解释、修复）
      - 包含条件逻辑
      - 包含 3 个测试用例

metadata:
  category: development
  priority: high
  usage_count: 0
  last_used: null
